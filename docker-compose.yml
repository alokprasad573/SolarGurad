services:
  solarguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solarguard-app
    image: solarguard:latest
    restart: unless-stopped

    ports:
      - "3000:3000" # host:container – visit http://localhost:3000

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

    deploy:
      resources:
        limits:
          memory: 512m

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
