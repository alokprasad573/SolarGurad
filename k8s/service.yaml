apiVersion: v1
kind: Service
metadata:
  name: solarguard-service
  namespace: solarguard
  labels:
    app: solarguard
spec:
  selector:
    app: solarguard
  type: LoadBalancer        # Exposes via cloud load balancer (GKE, EKS, AKS)
                            # Use NodePort for bare-metal / Minikube
  ports:
    - name: http
      protocol: TCP
      port: 80              # External port users hit
      targetPort: 3000      # Container port Flask/Waitress listens on
