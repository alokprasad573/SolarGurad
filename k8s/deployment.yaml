apiVersion: apps/v1
kind: Deployment
metadata:
  name: solarguard
  namespace: solarguard
  labels:
    app: solarguard
spec:
  replicas: 2                     # Run 2 pods for high availability
  selector:
    matchLabels:
      app: solarguard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                 # Allow 1 extra pod during rollout
      maxUnavailable: 0           # Never have zero healthy pods
  template:
    metadata:
      labels:
        app: solarguard
    spec:
      # ── Security ────────────────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000           # Matches the 'appuser' UID created in Dockerfile
        fsGroup: 1000

      # ── Init container: pre-warm model into shared volume ──────────────────
      # (Remove this block if you bake the model into the image instead)
      initContainers: []

      # ── Main container ──────────────────────────────────────────────────────
      containers:
        - name: solarguard
          image: solarguard:latest      # Replace with your registry path, e.g.:
                                        # ghcr.io/<username>/solarguard:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Load environment from ConfigMap
          envFrom:
            - configMapRef:
                name: solarguard-config

          # Mount the model weights volume
          volumeMounts:
            - name: model-weights
              mountPath: /app/Model
              readOnly: true

          # ── Resource limits ─────────────────────────────────────────────────
          # TensorFlow can be memory-hungry; tune these for your node size
          resources:
            requests:
              cpu: "500m"         # 0.5 CPU core minimum
              memory: "1Gi"
            limits:
              cpu: "2000m"        # Max 2 CPU cores
              memory: "2Gi"

          # ── Probes ──────────────────────────────────────────────────────────
          # Startup probe — give TF enough time to load the model before kubelet
          # starts liveness checks (avoids premature restarts on cold start)
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30  # 30 × 10s = 5 min max startup time
            periodSeconds: 10

          # Liveness probe — restart pod if the server hangs
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe — only send traffic once the pod is ready
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      # ── Volumes ─────────────────────────────────────────────────────────────
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: solarguard-model-pvc
            readOnly: true
