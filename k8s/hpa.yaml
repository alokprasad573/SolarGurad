apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: solarguard-hpa
  namespace: solarguard
  labels:
    app: solarguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: solarguard
  minReplicas: 2            # Keep at least 2 pods for HA
  maxReplicas: 8            # Scale up to 8 pods under heavy inference load
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # Scale up when average CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # Scale up when average memory > 80%
